server {
    listen 80;
    server_name 101.42.111.251 pixeltoy.cn www.pixeltoy.cn;

    client_max_body_size 200M;

    location /_pixel-toy-final-cut/ {
        internal;
        alias /home/ubuntu/apps/pixel-toy/projects/;
    }

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Pixel-Toy-Final-Cut-Accel 1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
server {
    listen 443 ssl http2;
    server_name pixeltoy.cn www.pixeltoy.cn;

    client_max_body_size 200M;

    ssl_certificate /etc/letsencrypt/live/pixeltoy.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixeltoy.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /_pixel-toy-final-cut/ {
        internal;
        alias /home/ubuntu/apps/pixel-toy/projects/;
    }

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Pixel-Toy-Final-Cut-Accel 1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
