<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Pixel Toys · 登录</title>
    <meta http-equiv="refresh" content="0;url=/?auth=login" />
    <script>
      const params = new URLSearchParams(window.location.search);
      const target = new URL("/", window.location.origin);
      target.searchParams.set("auth", params.get("mode") === "register" ? "register" : "login");
      const next = String(params.get("next") || "").trim();
      if (next.startsWith("/") && !next.startsWith("//") && !next.startsWith("/auth.html")) target.searchParams.set("next", next);
      window.location.replace(target.href);
    </script>
  </head>
  <body>
    <p>正在打开 Pixel Toys 登录窗口...</p>
  </body>
</html>
